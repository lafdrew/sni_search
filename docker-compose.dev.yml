version: '3.8'

services:
  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sni-qdrant-dev
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage_dev:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - sni-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 后端服务（本地构建，支持热重载）
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: sni-backend-dev
    ports:
      - "9000:9000"
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - API_HOST=0.0.0.0
      - API_PORT=9000
    volumes:
      # 挂载源代码（支持热重载）
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./conf.yaml:/app/conf.yaml
      - ./results:/app/results
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - sni-network
    restart: unless-stopped
    command: ["python", "-m", "src.api_server"]

  # 前端服务（本地构建）
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:9000
    container_name: sni-frontend-dev
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sni-network
    restart: unless-stopped

networks:
  sni-network:
    driver: bridge

volumes:
  qdrant_storage_dev:
    driver: local
